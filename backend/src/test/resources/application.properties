spring.datasource.url=jdbc:h2:mem:mafia;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
security.jwt.secret=test_secret_key_for_mafia_security_tests_32_chars_minimum
security.jwt.access-token-ttl-minutes=100
security.refresh-token-ttl-days=30
security.refresh-token-game-grace-hours=12
security.cors.allowed-origins=http://localhost:*
