spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}
server.address=0.0.0.0

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:100}
security.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}
security.refresh-token-game-grace-hours=${REFRESH_TOKEN_GAME_GRACE_HOURS:12}
security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://172.16.*:*,http://172.17.*:*,http://172.18.*:*,http://172.19.*:*,http://172.20.*:*,http://172.21.*:*,http://172.22.*:*,http://172.23.*:*,http://172.24.*:*,http://172.25.*:*,http://172.26.*:*,http://172.27.*:*,http://172.28.*:*,http://172.29.*:*,http://172.30.*:*,http://172.31.*:*,http://192.168.*:*}

logging.file.name=logs/mafia-backend.log
logging.level.root=INFO
logging.level.alafonin4.mafia=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [req:%X{requestId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [req:%X{requestId}] %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
